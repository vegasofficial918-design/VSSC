<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">  
    <title>Vegas Syndicate</title>  
    <link rel="stylesheet" href="style.css">  
</head>  
<body>  
  
<div id="game">  
  
    <header id="topBar">  
        <div class="logo">  
            <img src="images/logo.png" alt="Vegas Syndicate">  
        </div>  
        <div id="coinsPanel">  
            <span class="label">Gold Coins</span>  
            <span id="goldCoins">1000</span>  
        </div>  
        <div id="playerInfo">  
            <div>Level: <span id="playerLevel">1</span></div>  
            <div>XP: <span id="playerXP">0</span></div>  
        </div>  
    </header>  
  
    <section id="slotMachine">  
        <div class="reels">  
            <div class="reel" id="reel1">  
                <div class="symbol" data-symbol="coin"><img src="images/coin.png"></div>  
                <div class="symbol" data-symbol="gold-bar"><img src="images/gold-bar.png"></div>  
                <div class="symbol" data-symbol="diamond-ring"><img src="images/diamond-ring.png"></div>  
            </div>  
            <div class="reel" id="reel2">  
                <div class="symbol" data-symbol="lucky-card"><img src="images/lucky-card.png"></div>  
                <div class="symbol" data-symbol="vegas-sign"><img src="images/vegas-sign.png"></div>  
                <div class="symbol" data-symbol="coin"><img src="images/coin.png"></div>  
            </div>  
            <div class="reel" id="reel3">  
                <div class="symbol" data-symbol="gold-bar"><img src="images/gold-bar.png"></div>  
                <div class="symbol" data-symbol="diamond-ring"><img src="images/diamond-ring.png"></div>  
                <div class="symbol" data-symbol="lucky-card"><img src="images/lucky-card.png"></div>  
            </div>  
            <div class="reel" id="reel4">  
                <div class="symbol" data-symbol="vegas-sign"><img src="images/vegas-sign.png"></div>  
                <div class="symbol" data-symbol="coin"><img src="images/coin.png"></div>  
                <div class="symbol" data-symbol="gold-bar"><img src="images/gold-bar.png"></div>  
            </div>  
            <div class="reel" id="reel5">  
                <div class="symbol" data-symbol="diamond-ring"><img src="images/diamond-ring.png"></div>  
                <div class="symbol" data-symbol="lucky-card"><img src="images/lucky-card.png"></div>  
                <div class="symbol" data-symbol="vegas-sign"><img src="images/vegas-sign.png"></div>  
            </div>  
        </div>  
  
        <div id="controls">  
            <div class="bet-controls">  
                <button id="btnBetDown">-</button>  
                <span>Bet: <span id="currentBet">10</span></span>  
                <button id="btnBetUp">+</button>  
            </div>  
            <button id="btnSpin">SPIN</button>  
            <div id="winDisplay">Win: <span id="winAmount">0</span></div>  
        </div>  
    </section>  
  
    <section id="payTable">  
        <h3>Paytable</h3>  
        <table>  
            <tr>  
                <th>Symbol</th>  
                <th>3</th>  
                <th>4</th>  
                <th>5</th>  
            </tr>  
            <tr>  
                <td><img src="images/coin.png" class="payIcon"></td>  
                <td>20</td>  
                <td>50</td>  
                <td>100</td>  
            </tr>  
            <tr>  
                <td><img src="images/gold-bar.png" class="payIcon"></td>  
                <td>30</td>  
                <td>75</td>  
                <td>150</td>  
            </tr>  
            <tr>  
                <td><img src="images/diamond-ring.png" class="payIcon"></td>  
                <td>50</td>  
                <td>125</td>  
                <td>300</td>  
            </tr>  
            <tr>  
                <td><img src="images/lucky-card.png" class="payIcon"></td>  
                <td>75</td>  
                <td>200</td>  
                <td>500</td>  
            </tr>  
            <tr>  
                <td><img src="images/vegas-sign.png" class="payIcon"></td>  
                <td>100</td>  
                <td>500</td>  
                <td>1000</td>  
            </tr>  
        </table>  
    </section>  
  
    <div id="loadingScreen">  
        <div class="loadingContent">  
            <img src="images/logo.png" class="loadingLogo">  
            <h2>Vegas Syndicate</h2>  
            <p>Loading Casino...</p>  
        </div>  
    </div>  
  
</div>  
  
<script>  
    // Game State  
    let balance = 1000;  
    let currentBet = 10;  
    const betStep = 5;  
    const minBet = 5;  
    const maxBet = 100;  
  
    // Symbol List for Random Generation  
    const symbolsList = ['coin', 'gold-bar', 'diamond-ring', 'lucky-card', 'vegas-sign'];  
  
    // Paytable Matrix (Multiplier values matching your table)  
    const payTableValues = {  
        'coin':         { 3: 20,  4: 50,  5: 100 },  
        'gold-bar':     { 3: 30,  4: 75,  5: 150 },  
        'diamond-ring': { 3: 50,  4: 125, 5: 300 },  
        'lucky-card':   { 3: 75,  4: 200, 5: 500 },  
        'vegas-sign':   { 3: 100, 4: 500, 5: 1000 }  
    };  
  
    // DOM Elements  
    const elBalance = document.getElementById('goldCoins');  
    const elBet = document.getElementById('currentBet');  
    const elWin = document.getElementById('winAmount');  
    const btnSpin = document.getElementById('btnSpin');  
    const btnBetUp = document.getElementById('btnBetUp');  
    const btnBetDown = document.getElementById('btnBetDown');  
    const loadingScreen = document.getElementById('loadingScreen');  
  
    // Dismiss Loading Screen on click (for preview purposes)  
    if(loadingScreen) {  
        loadingScreen.addEventListener('click', () => loadingScreen.style.display = 'none');  
        // Auto hide after 1.5s  
        setTimeout(() => loadingScreen.style.display = 'none', 1500);  
    }  
  
    // Bet Handlers  
    btnBetUp.addEventListener('click', () => {  
        if (currentBet + betStep <= maxBet) {  
            currentBet += betStep;  
            elBet.textContent = currentBet;  
        }  
    });  
  
    btnBetDown.addEventListener('click', () => {  
        if (currentBet - betStep >= minBet) {  
            currentBet -= betStep;  
            elBet.textContent = currentBet;  
        }  
    });  
  
    // Spin Main Event  
    btnSpin.addEventListener('click', () => {  
        if (balance < currentBet) {  
            alert("Not enough Gold Coins!");  
            return;  
        }  
  
        // Deduct Bet  
        balance -= currentBet;  
        elBalance.textContent = balance;  
        elWin.textContent = "0";  
  
        // Generate Random Result Grid (3 rows, 5 columns)  
        // Each reel will get 3 random symbols assigned visually  
        const grid = [[], [], []]; // Rows 0, 1, 2 Across Columns 0 to 4  
  
        for (let col = 1; col <= 5; col++) {  
            const reel = document.getElementById(`reel${col}`);  
            const symbolElements = reel.querySelectorAll('.symbol');  
              
            symbolElements.forEach((el, rowIndex) => {  
                // Pick a random symbol  
                const randomSym = symbolsList[Math.floor(Math.random() * symbolsList.length)];  
                  
                // Update DOM elements visually  
                el.setAttribute('data-symbol', randomSym);  
                el.querySelector('img').src = `images/${randomSym}.png`;  
                el.querySelector('img').alt = randomSym;  
  
                // Save to grid structural layout  
                grid[rowIndex].push(randomSym);  
            });  
        }  
  
        // Evaluate Wins & Trigger Payout  
        const totalWin = evaluatePayout(grid);  
          
        if (totalWin > 0) {  
            balance += totalWin;  
            elBalance.textContent = balance;  
            elWin.textContent = totalWin;  
        }  
    });  
  
    /**  
     * Win Evaluation Engine  
     * Evaluates standard left-to-right line wins for all 3 horizontal rows.  
     */  
    function evaluatePayout(grid) {  
        let spinEarnings = 0;  
  
        // Check each row (0, 1, 2)  
        for (let row = 0; row < 3; row++) {  
            const rowSymbols = grid[row];  
            let matchCount = 1;  
            let targetSymbol = rowSymbols[0];  
  
            // Count sequential matching symbols starting from left (Col 0)  
            for (let col = 1; col < 5; col++) {  
                if (rowSymbols[col] === targetSymbol) {  
                    matchCount++;  
                } else {  
                    break; // Break sequence on mismatch  
                }  
            }  
  
            // If we have 3 or more matching symbols, calculate payout  
            if (matchCount >= 3) {  
                const payoutConfig = payTableValues[targetSymbol];  
                if (payoutConfig && payoutConfig[matchCount]) {  
                    // Line Win calculation: Multiplier value * (Bet / 10 base)  
                    const lineWin = payoutConfig[matchCount] * (currentBet / 10);  
                    spinEarnings += lineWin;  
                }  
            }  
        }  
  
        return spinEarnings;  
    }  
</script>  
  
<script src="script.js"></script>  
</body>  
</html>
